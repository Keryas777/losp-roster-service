name: Event planner mobile browsers

on:
  pull_request:
    paths:
      - "src/**"
      - "public/event-planner/**"
      - "tests/event-planner/**"
      - "tests/event-planner.browser.spec.mjs"
      - ".github/workflows/event-planner-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary Playwright tooling
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test the served planner on a mobile viewport
        run: node tests/event-planner.browser.spec.mjs
        env:
          BROWSER: ${{ matrix.browser }}
