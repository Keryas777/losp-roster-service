name: Validate invited alliance administration
on:
  pull_request:
    paths:
      - "src/admin-arena-coverage.js"
      - "src/admin-routes.js"
      - "src/player-identity-links.js"
      - "public/admin-player-links.js"
      - "tests/player-identity-links.test.mjs"
      - "src/member-info-reward.js"
      - "src/public-arena-history.js"
      - "src/index.js"
      - "src/secure-guest-arena-history.js"
      - "src/secure-guest-rosters.js"
      - "src/secure-guest-infos.js"
      - "src/secure-guest-evolution.js"
      - "src/permanent-guest-evolution.js"
      - "src/alliance-season-ranks.js"
      - "src/collection-overview.js"
      - "public/admin-arena-coverage.js"
      - "public/admin-reward-info-manual.js"
      - "public/admin-season-ranks.js"
      - "public/admin-collection-dashboard.js"
      - "public/admin-navigation.js"
      - "public/admin-roster-preflight.js"
      - "tests/admin-arena-coverage.test.mjs"
      - "tests/admin-guest-webapp-binding-feedback.test.mjs"
      - "tests/public-arena-history.test.mjs"
      - "tests/secure-guest-arena-history.test.mjs"
      - "tests/secure-guest-rosters.test.mjs"
      - "tests/secure-guest-infos.test.mjs"
      - "tests/secure-guest-evolution.test.mjs"
      - "tests/permanent-guest-evolution.test.mjs"
      - "tests/admin-arena-pending-labels.test.mjs"
      - "tests/member-info-reward-manual.test.mjs"
      - "tests/alliance-season-ranks.test.mjs"
      - "tests/collection-overview.test.mjs"
      - ".github/workflows/validate-guest-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax checks and existing collector regressions
        run: |
          node --check src/admin-arena-coverage.js
          node --check src/admin-routes.js
          node --check src/player-identity-links.js
          node --check public/admin-player-links.js
          node --check src/member-info-reward.js
          node --check src/public-arena-history.js
          node --check src/secure-guest-arena-history.js
          node --check src/secure-guest-rosters.js
          node --check src/secure-guest-infos.js
          node --check src/secure-guest-evolution.js
          node --check src/permanent-guest-evolution.js
          node --check src/index.js
          node --check src/alliance-season-ranks.js
          node --check src/collection-overview.js
          node --check public/admin-arena-coverage.js
          node --check public/admin-season-ranks.js
          node --check public/admin-reward-info-manual.js
          node --check public/admin-collection-dashboard.js
          node --check public/admin-navigation.js
          node --check public/admin-roster-preflight.js
          node --test tests/player-identity-links.test.mjs tests/permanent-guest-evolution.test.mjs tests/secure-guest-evolution.test.mjs tests/secure-guest-infos.test.mjs tests/admin-guest-webapp-binding-feedback.test.mjs tests/secure-guest-arena-history.test.mjs tests/secure-guest-rosters.test.mjs tests/admin-arena-coverage.test.mjs tests/admin-arena-pending-labels.test.mjs tests/member-info-reward-manual.test.mjs tests/member-info-reward.test.mjs tests/alliance-season-ranks.test.mjs tests/public-arena-history.test.mjs tests/collection-overview.test.mjs tests/roster-r2-coverage.test.mjs tests/guest-alliance-approvals.test.mjs
