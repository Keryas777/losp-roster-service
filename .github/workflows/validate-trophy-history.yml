name: Validate connected trophy history
on:
  pull_request:
    paths:
      - "src/public-trophy-history.js"
      - "src/index.js"
      - "tests/public-trophy-history.test.mjs"
      - ".github/workflows/validate-trophy-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax and regression tests
        run: |
          node --check src/public-trophy-history.js
          node --check src/index.js
          node --test tests/public-trophy-history.test.mjs tests/trophy-github-dispatch.test.mjs tests/guest-alliance-approvals.test.mjs
